<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="2026 KBO 응원가 전용 플레이어. 구단 응원가, 선수 응원가, 등장곡, 안타·아웃송을 오늘 라인업 순서대로 들어보세요.">
    <title>엔조이 야구 응원가 · 2026 KBO 응원가 모음</title>
    <link class="tab-logo" rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="players.js"></script>
    <script src="kia_songs.js"></script>
    <script src="cheer_songs.js"></script>
    <style>
        @font-face { font-family: 'KBO-Dia-Gothic'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KBO-Dia-Gothic_light.woff') format('woff'); font-weight: 300; font-style: normal; font-display: swap; }
        @font-face { font-family: 'KBO-Dia-Gothic'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KBO-Dia-Gothic_medium.woff') format('woff'); font-weight: 500; font-style: normal; font-display: swap; }
        @font-face { font-family: 'KBO-Dia-Gothic'; src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2304-2@1.0/KBO-Dia-Gothic_bold.woff') format('woff'); font-weight: 700; font-style: normal; font-display: swap; }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
        img { display: block; }

        :root {
            --point: #EA0029;
            --point-soft: rgba(234, 0, 41, 0.22);
            --bg: #000000;
            --surface: #1C1C1E;
            --surface-2: #232326;
            --line: rgba(255, 255, 255, 0.09);
            --text: #FFFFFF;
            --text-2: rgba(255, 255, 255, 0.62);
            --text-3: rgba(255, 255, 255, 0.38);
            --player-bar: #1A1A1C;
            --nav-h: 60px;
            --bar-h: 56px;
        }
        body[data-theme="KIA"]  { --point: #EA0029; --point-soft: rgba(234, 0, 41, 0.22); }
        body[data-theme="삼성"] { --point: #2F7BE0; --point-soft: rgba(47, 123, 224, 0.22); }
        body[data-theme="LG"]   { --point: #E4376E; --point-soft: rgba(228, 55, 110, 0.22); }
        body[data-theme="두산"] { --point: #4C6EF5; --point-soft: rgba(76, 110, 245, 0.22); }
        body[data-theme="KT"]   { --point: #E8112D; --point-soft: rgba(232, 17, 45, 0.22); }
        body[data-theme="SSG"]  { --point: #E63950; --point-soft: rgba(230, 57, 80, 0.22); }
        body[data-theme="롯데"] { --point: #3B6FD4; --point-soft: rgba(59, 111, 212, 0.22); }
        body[data-theme="한화"] { --point: #FF7A1A; --point-soft: rgba(255, 122, 26, 0.22); }
        body[data-theme="NC"]   { --point: #4A78C0; --point-soft: rgba(74, 120, 192, 0.22); }
        body[data-theme="키움"] { --point: #C23A6B; --point-soft: rgba(194, 58, 107, 0.22); }
        body[data-theme="all"]  { --point: #6E8BFF; --point-soft: rgba(110, 139, 255, 0.22); }

        body {
            font-family: 'KBO-Dia-Gothic', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            letter-spacing: -0.02em;
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 430px;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }
        @media (min-width: 431px) {
            #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
        }

        .scroll-y { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
        .scroll-x { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
        .no-bar::-webkit-scrollbar { display: none; }
        .no-bar { scrollbar-width: none; -ms-overflow-style: none; }

        /* ── 상단 바 ───────────────────────────────────────────── */
        #topbar {
            position: relative;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 0 0 auto;
            height: 52px;
            padding: 0 16px;
            padding-top: env(safe-area-inset-top);
            height: calc(52px + env(safe-area-inset-top));
            background: var(--bg);
        }
        .team-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 34px;
            padding: 0 15px;
            border: 1.5px solid rgba(255,255,255,0.9);
            border-radius: 999px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            transition: transform .15s ease, border-color .2s ease, color .2s ease;
        }
        .team-chip:active { transform: scale(0.95); }
        .team-chip i { font-size: 10px; opacity: 0.75; }
        .top-actions { display: flex; align-items: center; gap: 20px; }
        .top-actions button { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 21px; color: #fff; transition: transform .15s ease; }
        .top-actions button:active { transform: scale(0.88); }
        .top-actions .dot { position: absolute; margin: -12px 0 0 12px; width: 6px; height: 6px; border-radius: 999px; background: var(--point); }

        /* ── 화면 ─────────────────────────────────────────────── */
        .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
        .screen.on { display: flex; }
        .screen-body { flex: 1; min-height: 0; padding-top: 6px; padding-bottom: 28px; }

        .sec { margin-top: 34px; }
        .sec:first-child { margin-top: 0; }
        .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 18px; margin-bottom: 14px; }
        .sec-title { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
        .sec-title h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.045em; white-space: nowrap; }
        .sec-tabs { display: flex; align-items: baseline; gap: 13px; min-width: 0; overflow-x: auto; }
        .sec-tabs::-webkit-scrollbar { display: none; }
        .sec-tab { font-size: 15px; font-weight: 700; color: var(--text-3); white-space: nowrap; transition: color .2s ease; }
        .sec-tab.on { color: var(--point); }
        .sec-more { flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--text-2); }
        .sec-more:active { color: #fff; }

        /* ── 히어로 카드 캐러셀 ─────────────────────────────────── */
        #hero-rail { display: flex; gap: 12px; padding: 0 18px 2px; scroll-snap-type: x mandatory; scroll-padding-left: 18px; }
        .hero-card {
            position: relative;
            flex: 0 0 auto;
            width: 324px;
            max-width: calc(100vw - 62px);
            height: 330px;
            padding: 20px 18px 18px;
            border-radius: 16px;
            overflow: hidden;
            scroll-snap-align: start;
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .hero-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.28) 100%);
            pointer-events: none;
        }
        .hero-card > * { position: relative; z-index: 1; }
        .hero-title { font-size: 23px; font-weight: 800; line-height: 1.28; letter-spacing: -0.05em; color: #fff; white-space: pre-line; text-shadow: 0 1px 12px rgba(0,0,0,0.22); }
        .hero-tracks { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding-right: 62px; }
        .hero-track { display: flex; align-items: center; gap: 13px; min-width: 0; }
        .hero-track-cover { flex: 0 0 50px; width: 50px; height: 50px; border-radius: 6px; overflow: hidden; background: rgba(0,0,0,0.34); display: flex; align-items: center; justify-content: center; padding: 4px; }
        .hero-track-cover img { width: 100%; height: 100%; object-fit: contain; }
        .hero-track-cover img.portrait { object-fit: cover; object-position: top; transform: scale(1.12); padding: 0; }
        .hero-track-main { min-width: 0; }
        .hero-track-title { font-size: 15.5px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hero-track-artist { margin-top: 3px; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hero-play {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 999px;
            background: #fff;
            color: #111;
            font-size: 19px;
            padding-left: 3px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.3);
            transition: transform .15s ease;
        }
        .hero-play:active { transform: scale(0.92); }
        .hero-card.hero-soon { height: auto; min-height: 172px; justify-content: flex-start; gap: 14px; }
        .hero-soon-desc { font-size: 13px; font-weight: 600; line-height: 1.65; color: rgba(255,255,255,0.72); }
        .hero-soon-cta { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; font-size: 12.5px; font-weight: 800; color: #fff; }
        .hero-dots { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 14px; }
        .hero-dot { width: 6px; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.22); transition: background-color .25s ease, width .25s ease; }
        .hero-dot.on { width: 16px; background: #fff; }

        /* ── 빠른 선곡 그리드 ───────────────────────────────────── */
        .quick-grid {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, auto);
            grid-auto-columns: min(246px, 68vw);
            gap: 9px;
            padding: 0 18px;
            overflow-x: auto;
            scroll-snap-type: x proximity;
            scroll-padding-left: 18px;
        }
        .quick-cell { scroll-snap-align: start; }
        .quick-cell {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 6px 10px 6px 6px;
            border-radius: 10px;
            background: var(--surface);
            text-align: left;
            transition: background-color .18s ease, transform .15s ease;
        }
        .quick-cell:active { background: var(--surface-2); transform: scale(0.985); }
        .quick-cover { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: #0d0d0f; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .quick-cover img { width: 100%; height: 100%; object-fit: contain; }
        .quick-cover img.portrait { object-fit: cover; object-position: top; transform: scale(1.12); padding: 0; }
        .quick-main { display: block; flex: 1; min-width: 0; }
        .quick-title { display: block; font-size: 14px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .quick-artist { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .quick-go { flex: 0 0 22px; display: flex; align-items: center; justify-content: center; font-size: 15px; color: rgba(255,255,255,0.72); }

        /* ── 곡 리스트 ─────────────────────────────────────────── */
        .song-list { display: flex; flex-direction: column; padding: 0 8px; }
        .song-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background-color .18s ease; }
        .song-row:active { background: rgba(255,255,255,0.06); }
        .song-idx { flex: 0 0 22px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .song-idx.is-text { flex: 0 0 26px; font-size: 10px; }
        .song-cover { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 6px; overflow: hidden; background: #131315; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .song-cover img { width: 100%; height: 100%; object-fit: contain; }
        .song-cover img.portrait { object-fit: cover; object-position: top; transform: scale(1.12); padding: 0; }
        .song-main { flex: 1; min-width: 0; }
        .song-title { font-size: 15px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { margin-top: 3px; font-size: 12.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-fav { flex: 0 0 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: rgba(255,255,255,0.3); transition: color .2s ease, transform .15s ease; }
        .song-fav.on { color: var(--point); }
        .song-fav:active { transform: scale(0.85); }
        .song-row.playing .song-title { color: var(--point); }

        .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
        .eq i { display: block; width: 2.5px; height: 100%; border-radius: 1px; background: var(--point); animation: eq 0.9s ease-in-out infinite; }
        .eq i:nth-child(2) { animation-delay: .18s; }
        .eq i:nth-child(3) { animation-delay: .36s; }
        .eq.paused i { animation-play-state: paused; }
        @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }

        .empty { padding: 34px 20px; text-align: center; color: var(--text-3); font-size: 13px; font-weight: 600; line-height: 1.7; white-space: pre-line; }
        .empty i { display: block; margin-bottom: 10px; font-size: 22px; opacity: 0.6; }

        /* ── 둘러보기 ─────────────────────────────────────────── */
        .browse-wrap { padding: 0 18px; display: flex; flex-direction: column; gap: 9px; }
        .browse-big {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            height: 96px;
            padding: 0 18px;
            border-radius: 14px;
            overflow: hidden;
            text-align: left;
            transition: transform .15s ease;
        }
        .browse-big:active { transform: scale(0.985); }
        .browse-big strong { display: block; font-size: 18px; font-weight: 800; letter-spacing: -0.04em; color: #fff; }
        .browse-big small { display: block; margin-top: 5px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.66); }
        .browse-big img { position: absolute; right: 14px; bottom: -12px; width: 88px; height: 88px; object-fit: contain; opacity: 0.28; }
        .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
        .team-cell { position: relative; display: flex; align-items: center; gap: 11px; height: 72px; padding: 0 13px; border-radius: 13px; overflow: hidden; text-align: left; transition: transform .15s ease; }
        .team-cell:active { transform: scale(0.975); }
        .team-cell.soon { opacity: 0.62; }
        .team-cell img { width: 34px; height: 34px; flex: 0 0 34px; object-fit: contain; }
        .team-cell-main { min-width: 0; }
        .team-cell strong { display: block; font-size: 13px; font-weight: 800; letter-spacing: -0.04em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-cell small { display: block; margin-top: 3px; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.62); }
        .browse-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; }
        .browse-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 9px; height: 96px; padding: 15px 15px; border-radius: 14px; background: var(--surface); text-align: left; transition: background-color .18s ease, transform .15s ease; }
        .browse-cell:active { background: var(--surface-2); transform: scale(0.985); }
        .browse-cell i { font-size: 16px; color: var(--point); }
        .browse-cell strong { font-size: 15px; font-weight: 800; color: #fff; }
        .browse-cell small { margin-top: auto; font-size: 11.5px; font-weight: 700; color: var(--text-3); }

        /* ── 검색 ─────────────────────────────────────────────── */
        .search-bar { display: flex; align-items: center; gap: 10px; height: 44px; margin: 4px 18px 0; padding: 0 14px; border-radius: 11px; background: var(--surface); }
        .search-bar i { font-size: 14px; color: var(--text-3); }
        .search-bar input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; color: #fff; font-family: inherit; font-size: 14.5px; font-weight: 700; }
        .search-bar input::placeholder { color: var(--text-3); font-weight: 600; }
        .search-bar button { width: 22px; height: 22px; display: none; align-items: center; justify-content: center; color: var(--text-3); }
        .search-bar button.on { display: flex; }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px; }
        .chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 999px; background: var(--surface); color: rgba(255,255,255,0.82); font-size: 12.5px; font-weight: 700; transition: background-color .18s ease; }
        .chip:active { background: var(--surface-2); }
        .chip i { font-size: 10px; color: var(--text-3); }

        /* ── 목록 상세(오버레이) ────────────────────────────────── */
        #list-view {
            position: absolute;
            top: 0; left: 0; right: 0;
            /* 하단 플레이어 바와 탭은 계속 보이도록 그만큼 비워 둔다 */
            bottom: calc(var(--nav-h) + var(--bar-h) + env(safe-area-inset-bottom));
            z-index: 60;
            display: none;
            flex-direction: column;
            background: var(--bg);
        }
        #list-view.on { display: flex; }
        .lv-head { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; height: 52px; padding: 0 8px 0 6px; padding-top: env(safe-area-inset-top); height: calc(52px + env(safe-area-inset-top)); }
        .lv-head button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 19px; }
        .lv-head span { flex: 1; min-width: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lv-hero { position: relative; margin: 2px 18px 0; padding: 20px 18px; border-radius: 16px; overflow: hidden; }
        .lv-hero img { position: absolute; right: -12px; bottom: -18px; width: 104px; height: 104px; object-fit: contain; opacity: 0.2; }
        .lv-hero strong { position: relative; display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.045em; color: #fff; white-space: pre-line; }
        .lv-hero small { position: relative; display: block; margin-top: 6px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); }
        .lv-actions { position: relative; display: flex; gap: 8px; margin-top: 16px; }
        .btn-pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; font-size: 12.5px; font-weight: 800; transition: transform .15s ease; }
        .btn-pill:active { transform: scale(0.96); }
        .btn-solid { background: #fff; color: #111; }
        .btn-ghost { background: rgba(255,255,255,0.14); color: #fff; }

        /* ── 하단 플레이어 바 ──────────────────────────────────── */
        #player-bar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            height: var(--bar-h);
            padding: 0 8px 0 16px;
            background: var(--player-bar);
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        #player-bar::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            height: 2px;
            width: var(--progress, 0%);
            background: var(--point);
            transition: width .25s linear;
        }
        #pb-open { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; height: 100%; text-align: left; }
        #pb-cover { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 5px; overflow: hidden; background: #0d0d0f; display: none; align-items: center; justify-content: center; padding: 3px; }
        #pb-cover.on { display: flex; }
        #pb-cover img { width: 100%; height: 100%; object-fit: contain; }
        #pb-cover img.portrait { object-fit: cover; object-position: top; transform: scale(1.12); padding: 0; }
        #pb-text { display: block; flex: 1; min-width: 0; }
        #pb-title { display: block; font-size: 14px; font-weight: 700; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #pb-title.on { font-weight: 800; color: #fff; }
        #pb-artist { margin-top: 2px; font-size: 11.5px; font-weight: 500; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
        #pb-artist.on { display: block; }
        .pb-ctrl { display: flex; align-items: center; flex: 0 0 auto; }
        .pb-ctrl button { width: 42px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; color: rgba(255,255,255,0.5); transition: color .2s ease, transform .15s ease; }
        .pb-ctrl button.live { color: #fff; }
        .pb-ctrl button:active { transform: scale(0.88); }
        .pb-ctrl button.play { font-size: 21px; }

        /* ── 하단 탭 ──────────────────────────────────────────── */

<script>
// ═══════════════════════════════════════════════════════════════
//  엔조이 야구 응원가 — 2026 KBO 응원가 전용 플레이어
// ═══════════════════════════════════════════════════════════════

/* ── Firestore(REST): 오늘 라인업 전용 ─────────────────────── */
const FS_KEY = "AIzaSyCQt6_wZA5oXTDVBlK0R6Rm2EXMfzCsOx0";
const FS_BASE = "https://firestore.googleapis.com/v1/projects/enjoykbooo/databases/(default)/documents";
function fsVal(v) {
    if (!v) return null;
    if (v.stringValue !== undefined) return v.stringValue;
    if (v.integerValue !== undefined) return Number(v.integerValue);
    if (v.doubleValue !== undefined) return v.doubleValue;
    if (v.booleanValue !== undefined) return v.booleanValue;
    if (v.nullValue !== undefined) return null;
    if (v.timestampValue !== undefined) return v.timestampValue;
    if (v.arrayValue !== undefined) return (v.arrayValue.values || []).map(fsVal);
    if (v.mapValue !== undefined) return fsFields(v.mapValue.fields || {});
    return null;
}
function fsFields(f) { const o = {}; for (const k in f) o[k] = fsVal(f[k]); return o; }
async function fsDoc(path) {
    const r = await fetch(`${FS_BASE}/${path}?key=${FS_KEY}`, { cache: 'no-store' });
    if (!r.ok) { if (r.status === 404) return null; throw new Error('fs ' + r.status); }
    const j = await r.json();
    return j.fields ? fsFields(j.fields) : null;
}

/* ── 상수 ──────────────────────────────────────────────────── */
const TEAMS = [
    { name: 'KIA',  id: 'kia',    full: 'KIA 타이거즈',   logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/kia_logoo.png',    tone: '#B0122B' },
    { name: '삼성', id: 'samsung', full: '삼성 라이온즈',  logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/samsung_logo.png', tone: '#1D4E96' },
    { name: 'LG',   id: 'lg',      full: 'LG 트윈스',      logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/lgtwins.png',      tone: '#A31049' },
    { name: '두산', id: 'doosan',  full: '두산 베어스',    logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/doosa.png',        tone: '#1E2A6B' },
    { name: 'KT',   id: 'kt',      full: 'KT 위즈',        logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/kt_logo.png',      tone: '#2E3238' },
    { name: 'SSG',  id: 'ssg',     full: 'SSG 랜더스',     logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/ssglan.png',       tone: '#A00E24' },
    { name: '롯데', id: 'lotte',   full: '롯데 자이언츠',  logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/lotteegi.png',     tone: '#10305E' },
    { name: '한화', id: 'hanwha',  full: '한화 이글스',    logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/hanwha_logo.png',  tone: '#B34500' },
    { name: 'NC',   id: 'nc',      full: 'NC 다이노스',    logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/ncdin.png',        tone: '#24406B' },
    { name: '키움', id: 'kiwoom',  full: '키움 히어로즈',  logo: 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/kiwoom.png',       tone: '#6B1230' }
];
const TEAM_NAMES = TEAMS.map(t => t.name);
const TEAM_IDS  = TEAMS.reduce((a, t) => ({ ...a, [t.name]: t.id }), {});
const TEAM_LOGO = TEAMS.reduce((a, t) => ({ ...a, [t.name]: t.logo }), {});
const TEAM_FULL = TEAMS.reduce((a, t) => ({ ...a, [t.name]: t.full }), {});
const TEAM_TONE = TEAMS.reduce((a, t) => ({ ...a, [t.name]: t.tone }), {});
const APP_LOGO = 'https://cdn.jsdelivr.net/gh/won429/enjoy_ballbase@main/logo.png';

const CATS = [
    { id: 'team',     name: '구단 응원가', short: '구단',      icon: 'fa-flag',      tone: '#8E1F2F' },
    { id: 'player',   name: '선수 응원가', short: '선수',      icon: 'fa-user',      tone: '#1D4E96' },
    { id: 'entrance', name: '등장곡',      short: '등장곡',    tone: '#8A6111',      icon: 'fa-door-open' },
    { id: 'hitout',   name: '안타·아웃송', short: '안타/아웃', tone: '#4C2A86',      icon: 'fa-bolt' }
];
const CAT_NAME = CATS.reduce((a, c) => ({ ...a, [c.id]: c.name }), {});

if (typeof playerImages === 'undefined') window.playerImages = {};
if (typeof kiaCheerData === 'undefined') window.kiaCheerData = { team: [], player: [], entrance: [], hitout: [] };

// KIA는 kia_songs.js, 나머지 구단은 cheer_songs.js 에서 불러온다.
if (typeof cheerSongs === 'undefined') window.cheerSongs = {};
const EMPTY_TEAM = { team: [], player: [], entrance: [], hitout: [] };
const cheerData = TEAMS.reduce((acc, t) => {
    acc[t.id] = (t.id === 'kia' ? kiaCheerData : cheerSongs[t.id]) || EMPTY_TEAM;
    return acc;
}, {});

/* ── 곡 인덱스 ─────────────────────────────────────────────── */
let SONGS = [];
const PLAYER_NAMES = Object.keys(playerImages || {});
function findPlayer(text) {
    let hit = '';
    for (const p of PLAYER_NAMES) if (text.includes(p) && p.length > hit.length) hit = p;
    return hit;
}
function buildIndex() {
    SONGS = [];
    for (const team of TEAM_NAMES) {
        const tid = TEAM_IDS[team];
        for (const cat of CATS) {
            const list = (cheerData[tid] && cheerData[tid][cat.id]) || [];
            list.forEach(s => {
                const player = (cat.id === 'player' || cat.id === 'entrance') ? findPlayer(`${s.label} ${s.title}`) : '';
                const portrait = Boolean(player && playerImages[player]);
                SONGS.push({
                    url: s.url, title: s.title, label: s.label, team, teamId: tid,
                    cat: cat.id, catName: cat.name, player, portrait,
                    cover: portrait ? playerImages[player] : TEAM_LOGO[team]
                });
            });
        }
    }
}
const byUrl = url => SONGS.find(s => s.url === url) || null;
const songsOf = (team, cat) => SONGS.filter(s => (!team || team === 'all' || s.team === team) && (!cat || s.cat === cat));
const hasSongs = t => SONGS.some(s => s.team === t);
const soonText = t => `${TEAM_FULL[t] || t} 응원가는 준비 중입니다.\n음원이 추가되면 바로 이용할 수 있어요.`;

/* ── 저장소 ────────────────────────────────────────────────── */
const K_FAV = 'cheer_favorites_v1', K_RECENT = 'cheer_recents_v1', K_QUERY = 'cheer_queries_v1', K_TEAM = 'kbo_selected_team';
let favorites = [], recents = [], queries = [];
function readStore() {
    const get = k => { try { const v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } };
    favorites = get(K_FAV); recents = get(K_RECENT); queries = get(K_QUERY);
}
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const isFav = url => favorites.includes(url);

function toggleFav(url) {
    const i = favorites.indexOf(url);
    if (i === -1) { favorites.unshift(url); toast('좋아요한 응원가에 담았어요'); }
    else { favorites.splice(i, 1); toast('좋아요를 해제했어요'); }
    write(K_FAV, favorites);
    document.querySelectorAll('[data-fav]').forEach(el => {
        if (el.dataset.fav !== url) return;
        el.classList.toggle('on', isFav(url));
        el.innerHTML = `<i class="fa-${isFav(url) ? 'solid' : 'regular'} fa-heart"></i>`;
    });
    syncFavIcon();
    if (tabIndex === 3) renderLibrary();
    if (listState && (listState.kind === 'fav')) openList('fav');
}
function favCurrent() { if (cur.url) toggleFav(cur.url); }
function syncFavIcon() {
    const b = document.getElementById('fp-fav');
    const on = cur.url && isFav(cur.url);
    b.classList.toggle('on', Boolean(on));
    b.innerHTML = `<i class="fa-${on ? 'solid' : 'regular'} fa-heart"></i>`;
}
function pushRecent(url) {
    recents = recents.filter(u => u !== url);
    recents.unshift(url);
    recents = recents.slice(0, 40);
    write(K_RECENT, recents);
}

/* ── 유틸 ──────────────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);
let toastTimer = null;
function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 2000);
}
function shade(hex, ratio) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * ratio), g = Math.round(((n >> 8) & 255) * ratio), b = Math.round((n & 255) * ratio);
    return `rgb(${r}, ${g}, ${b})`;
}
const cardBg = tone => `background: linear-gradient(158deg, ${tone} 0%, ${shade(tone, 0.55)} 52%, ${shade(tone, 0.34)} 100%);`;
const coverImg = (s, cls = '') => `<img src="${esc(s.cover)}" class="${s.portrait ? 'portrait' : ''} ${cls}" loading="lazy" alt="" onerror="coverFallback(this, '${s.team}')">`;
function coverFallback(img, team) { img.onerror = null; img.classList.remove('portrait'); img.src = TEAM_LOGO[team] || APP_LOGO; }
function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}
const fmtTime = s => isNaN(s) ? '00:00' : `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ── 곡 리스트 렌더 ────────────────────────────────────────── */
const lists = {};
function songRow(s, i, listId, opt) {
    const playing = cur.url === s.url;
    const num = opt.badge ? opt.badge(s, i) : String(i + 1);
    const inner = playing ? `<span class="eq${playing && isPlaying ? '' : ' paused'}"><i></i><i></i><i></i></span>` : esc(num);
    const artist = opt.artist ? opt.artist(s) : `${s.team} · ${s.catName}`;
    return `<div class="song-row${playing ? ' playing' : ''}" data-list="${listId}" data-i="${i}">`
        + `<div class="song-idx${/^\d+$/.test(num) ? '' : ' is-text'}" data-num="${esc(num)}" data-url="${esc(s.url)}">${inner}</div>`
        + `<div class="song-cover">${coverImg(s)}</div>`
        + `<div class="song-main"><div class="song-title">${esc(s.label)}</div><div class="song-artist">${esc(artist)}</div></div>`
        + `<button class="song-fav${isFav(s.url) ? ' on' : ''}" data-fav="${esc(s.url)}" aria-label="좋아요"><i class="fa-${isFav(s.url) ? 'solid' : 'regular'} fa-heart"></i></button>`
        + `</div>`;
}
function renderList(id, songs, opt = {}) {
    lists[id] = songs;
    const el = $(id);
    if (!el) return;
    el.innerHTML = songs.length
        ? songs.map((s, i) => songRow(s, i, id, opt)).join('')
        : `<div class="empty"><i class="fa-solid ${opt.emptyIcon || 'fa-music'}"></i>${esc(opt.empty || '표시할 응원가가 없습니다.')}</div>`;
}
function syncRows() {
    document.querySelectorAll('.song-idx[data-url]').forEach(el => {
        const on = el.dataset.url === cur.url;
        el.closest('.song-row').classList.toggle('playing', on);
        el.innerHTML = on ? `<span class="eq${isPlaying ? '' : ' paused'}"><i></i><i></i><i></i></span>` : (el.dataset.num || '');
    });
    syncFavIcon();
}

document.addEventListener('click', e => {
    const fav = e.target.closest('[data-fav]');
    if (fav) { e.preventDefault(); e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
    const row = e.target.closest('[data-list]');
    if (row) playFrom(row.dataset.list, Number(row.dataset.i));
});

/* ── 재생 엔진 ─────────────────────────────────────────────── */
let audio = null;
let queue = [], qIndex = -1, isPlaying = false, seeking = false;
let shuffleOn = false, repeatMode = 'all';
let cur = { url: '', label: '', artist: '', cover: '', portrait: false };

function playFrom(listId, i) {
    const list = lists[listId] || [];
    if (!list[i]) return;
    queue = list.slice(); qIndex = i;
    play(queue[i]);
}
function playSongs(songs, shuffle) {
    if (!songs || !songs.length) { toast('재생할 곡이 없습니다.'); return; }
    queue = shuffle ? shuffled(songs) : songs.slice();
    qIndex = 0;
    play(queue[0]);
}
function play(song) {
    if (!song) return;
    if (!audio) initAudio();
    cur = { url: song.url, label: song.label, artist: `${TEAM_FULL[song.team] || song.team} · ${song.catName}`, cover: song.cover, portrait: song.portrait };

    audio.src = song.url;
    audio.play()
        .then(() => { isPlaying = true; paintPlay(); syncRows(); })
        .catch(err => { if (err && err.name !== 'AbortError') console.error(err); });

    $('pb-cover').classList.add('on');
    const pbi = $('pb-cover-img');
    pbi.onerror = () => coverFallback(pbi, song.team);
    pbi.src = song.cover; pbi.className = song.portrait ? 'portrait' : '';
    $('pb-title').textContent = song.label; $('pb-title').classList.add('on');
    $('pb-artist').textContent = `${song.team} · ${song.catName}`; $('pb-artist').classList.add('on');

    const art = $('fp-art');
    art.onerror = () => coverFallback(art, song.team);
    art.src = song.cover; art.className = song.portrait ? 'portrait' : '';
    $('fp-bg-img').src = song.cover;
    $('fp-title').textContent = song.label;
    $('fp-artist').textContent = cur.artist;
    paintLyric(song);
    $('fp-fill').style.width = '0%'; $('fp-range').value = 0;
    document.documentElement.style.setProperty('--progress', '0%');

    pushRecent(song.url);
    syncRows();
    if (tabIndex === 3) renderLibrary();
    mediaSession(song);
}
function paintPlay() {
    $('pb-play').className = `fa-solid fa-${isPlaying ? 'pause' : 'play'}`;
    $('fp-play').className = `fa-solid fa-${isPlaying ? 'pause' : 'play'}`;
    document.querySelectorAll('.pb-ctrl button').forEach(b => b.classList.toggle('live', Boolean(cur.url)));
}
function togglePlay() {
    if (!audio || !cur.url) { toast('재생할 곡을 먼저 선택해 주세요'); return; }
    if (audio.paused) audio.play(); else audio.pause();
}
function nextSong() {
    if (!queue.length) return;
    if (shuffleOn && queue.length > 1) { let n = qIndex; while (n === qIndex) n = Math.floor(Math.random() * queue.length); qIndex = n; }
    else qIndex = (qIndex + 1) % queue.length;
    play(queue[qIndex]);
}
function prevSong() {
    if (!queue.length) return;
    if (audio && audio.currentTime > 3) { audio.currentTime = 0; return; }
    qIndex = (qIndex - 1 + queue.length) % queue.length;
    play(queue[qIndex]);
}
function toggleShuffle() {
    shuffleOn = !shuffleOn;
    $('fp-shuffle').classList.toggle('on', shuffleOn);
    toast(shuffleOn ? '셔플 재생 켜짐' : '셔플 재생 꺼짐');
}
function toggleRepeat() {
    repeatMode = repeatMode === 'all' ? 'one' : (repeatMode === 'one' ? 'off' : 'all');
    $('fp-repeat').classList.toggle('on', repeatMode !== 'off');
    $('fp-repeat-1').style.display = repeatMode === 'one' ? 'block' : 'none';
    toast(repeatMode === 'all' ? '전체 반복' : repeatMode === 'one' ? '한 곡 반복' : '반복 없음');
}
function openPlayer() {
    if (!cur.url) { toast('재생 중인 응원가가 없습니다'); return; }
    $('full-player').classList.add('on');
    syncFavIcon();
}
function closePlayer() { $('full-player').classList.remove('on'); }

function mediaSession(song) {
    if (!('mediaSession' in navigator)) return;
    const art = song.cover.startsWith('http') ? song.cover : new URL(song.cover, location.href).href;
    navigator.mediaSession.metadata = new MediaMetadata({
        title: song.label,
        artist: `${TEAM_FULL[song.team] || song.team} ${song.catName}`,
        album: '엔조이 야구 응원가',
        artwork: [{ src: art, sizes: '512x512', type: 'image/png' }, { src: art, sizes: '192x192', type: 'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', () => audio && audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio && audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', prevSong);
    navigator.mediaSession.setActionHandler('nexttrack', nextSong);
}
function toAndroid(state) {
    if (window.AndroidBridge && window.AndroidBridge.updateMusicState) window.AndroidBridge.updateMusicState(state, cur.label);
}
window.appPlayMusic = () => { if (audio && cur.url) audio.play(); };
window.appPauseMusic = () => { if (audio) audio.pause(); };
window.appNextMusic = nextSong;
window.appPrevMusic = prevSong;

function initAudio() {
    audio = $('audio');
    const fill = $('fp-fill'), range = $('fp-range'), curT = $('fp-cur'), durT = $('fp-dur');
    const total = () => audio.duration ? fmtTime(audio.duration) : '00:00';

    audio.addEventListener('play', () => { isPlaying = true; paintPlay(); syncRows(); toAndroid('PLAYING'); });
    audio.addEventListener('pause', () => { isPlaying = false; paintPlay(); syncRows(); toAndroid('PAUSED'); });
    audio.addEventListener('timeupdate', () => {
        if (seeking || !audio.duration) return;
        const p = (audio.currentTime / audio.duration) * 100;
        fill.style.width = p + '%';
        range.value = p;
        document.documentElement.style.setProperty('--progress', p + '%');
        curT.textContent = fmtTime(audio.currentTime);
        durT.textContent = total();
    });
    audio.addEventListener('loadedmetadata', () => { durT.textContent = total(); });
    audio.addEventListener('ended', () => {
        if (repeatMode === 'one') { audio.currentTime = 0; audio.play(); return; }
        if (repeatMode === 'off' && !shuffleOn && qIndex === queue.length - 1) { isPlaying = false; paintPlay(); syncRows(); return; }
        nextSong();
    });
    range.addEventListener('input', e => {
        seeking = true;
        const t = (e.target.value / 100) * (audio.duration || 0);
        fill.style.width = e.target.value + '%';
        curT.textContent = fmtTime(t);
        durT.textContent = total();
    });
    range.addEventListener('change', e => { seeking = false; if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration; });
}

/* ── 팀 / 탭 ───────────────────────────────────────────────── */
let team = localStorage.getItem(K_TEAM);
if (!['all', 'KIA', '삼성'].includes(team)) team = 'KIA';
let tabIndex = 0, homeSongTab = 'team';

function setTeam(t) {
    team = t;
    localStorage.setItem(K_TEAM, t);
    document.body.dataset.theme = t;
    $('chip-team').textContent = t === 'all' ? '전체' : t;
    closeSheet();
    renderTab();
    toast(t === 'all' ? '전체 구단 응원가를 봅니다' : `${TEAM_FULL[t]} 응원가를 봅니다`);
}

const SCREENS = ['screen-home', 'screen-browse', 'screen-search', 'screen-library'];
function switchTab(i) {
    tabIndex = i;
    if (navigator.vibrate) navigator.vibrate(8);
    closeList();
    SCREENS.forEach((id, n) => $(id).classList.toggle('on', n === i));

function saveQuery(q) {

/* ── 이퀄라이저(Web Audio) ─────────────────────────────────── */
// 기본값에서는 오디오 그래프를 만들지 않는다. 프리셋을 고른 순간에만 연결해
// 웹뷰 등 지원이 불안정한 환경에서 기본 재생 경로를 건드리지 않도록 한다.
const EQ_PRESETS = {
    flat:   { name: '기본',      desc: '원음 그대로',            gains: [0, 0, 0] },
    bass:   { name: '저음 강화', desc: '북소리와 베이스를 두껍게', gains: [7, 0, -1] },
    vocal:  { name: '보컬 강조', desc: '응원 구호가 또렷하게',    gains: [-2, 5, 1] },
    treble: { name: '고음 강조', desc: '트럼펫과 함성을 밝게',    gains: [0, 0, 6] }
};
let audioCtx = null, eqBands = null, eqPreset = 'flat';
function ensureEQ() {
    if (eqBands) return true;
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC || !audio) return false;
        audioCtx = new AC();
        const src = audioCtx.createMediaElementSource(audio);
        const low = audioCtx.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 220;
        const mid = audioCtx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1200; mid.Q.value = 1;
        const high = audioCtx.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 4500;
        src.connect(low); low.connect(mid); mid.connect(high); high.connect(audioCtx.destination);
        eqBands = [low, mid, high];
        return true;
    } catch (e) { audioCtx = null; eqBands = null; return false; }
}
function setEQ(key) {
    if (!EQ_PRESETS[key]) return;
    if (key !== 'flat' || eqBands) {
        if (!ensureEQ()) { toast('이 환경에서는 이퀄라이저를 사용할 수 없어요'); return; }
    }
    eqPreset = key;
    if (eqBands) EQ_PRESETS[key].gains.forEach((g, i) => { eqBands[i].gain.value = g; });
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    $('fp-eq-btn').classList.toggle('on', key !== 'flat');
    renderEQ();
    toast(`${EQ_PRESETS[key].name} 적용`);
}
function renderEQ() {
    $('eq-list').innerHTML = Object.keys(EQ_PRESETS).map(k => `
        <button class="eq-row" onclick="setEQ('${k}')">
            <span><strong>${esc(EQ_PRESETS[k].name)}</strong><small>${esc(EQ_PRESETS[k].desc)}</small></span>
            ${eqPreset === k ? '<span class="set-val"><i class="fa-solid fa-check"></i></span>' : ''}
        </button>`).join('');
}

                  { id: 'all', name: '전체 구단', logo: APP_LOGO, n: SONGS.length }];
    $('team-list').innerHTML = opts.map(o => `
        <button class="set-row" style="width:100%" onclick="setTeam('${o.id}')">
            <span style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
                <img src="${o.logo}" style="width:30px;height:30px;object-fit:contain;flex:0 0 30px" alt="" onerror="this.style.visibility='hidden'">
                <span style="min-width:0"><strong>${esc(o.name)}</strong><small>${o.n ? o.n + '곡' : '음원 준비 중'}</small></span>
            </span>
            ${team === o.id ? '<span class="set-val"><i class="fa-solid fa-check"></i></span>' : ''}
        </button>`).join('');
}

        <button class="set-row" style="width:100%" onclick="toggleRepeat(); renderSetting();">

        </button>
        <button class="set-row" style="width:100%" onclick="recents=[];write('${K_RECENT}',recents);renderLibrary();renderSetting();toast('최근 들은 기록을 지웠어요')">

        </button>
        <button class="set-row" style="width:100%" onclick="favorites=[];write('${K_FAV}',favorites);renderLibrary();renderSetting();toast('좋아요를 모두 해제했어요')">

        <div class="set-row"><span><small style="color:var(--text-3)">Copyright © 2026 엔조이 야구. All rights reserved.</small></span></div>`;
}

/* ── 오늘 라인업 ───────────────────────────────────────────── */
let scheduleData = [], liveStore = {}, pollTimer = null;
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function baseDate() { const d = new Date(); if (d.getHours() < 11) d.setDate(d.getDate() - 1); return d; }

function lineupInfo(t) {
    const base = baseDate(), ds = ymd(base);
    const dateLabel = `${base.getMonth() + 1}월 ${base.getDate()}일`;
    const match = scheduleData.find(m => m.date === ds && (m.team1 === t || m.team2 === t));
    if (!match) return { team: t, caption: `${dateLabel} 경기가 없습니다`, songs: null };

    const live = liveStore[match.id];
    let raw = [];
    if (live) {
        raw = match.team1 === t
            ? ((live.awayLineupDetail && live.awayLineupDetail.length) ? live.awayLineupDetail : (live.awayLineup || []))
            : ((live.homeLineupDetail && live.homeLineupDetail.length) ? live.homeLineupDetail : (live.homeLineup || []));
    }
    if (!raw.length) return { team: t, caption: `${dateLabel} · 라인업 발표 전`, songs: null, match };

    const teamSongs = songsOf(t, 'team'), playerSongs = songsOf(t, 'player'), entSongs = songsOf(t, 'entrance');
    const out = [];
    const ls = teamSongs.find(s => s.label.includes('라인업송'));
    if (ls) out.push({ ...ls, order: '구단' });
    raw.forEach((p, i) => {
        const name = (typeof p === 'object' && p !== null) ? (p.name || '') : String(p || '');
        if (!name) return;
        const ent = entSongs.find(s => s.label.includes(name) || s.title.includes(name));
        if (ent) out.push({ ...ent, order: String(i + 1) });
        playerSongs.filter(s => s.label.includes(name) || s.title.includes(name)).forEach(s => out.push({ ...s, order: String(i + 1) }));
    });
    const vs = match.team1 === t ? match.team2 : match.team1;
    return { team: t, caption: `${dateLabel} vs ${vs}${match.stadium ? ' · ' + match.stadium : ''}`, songs: out, match };
}

async function loadMonth(y, m) {
    try {
        const d = await fsDoc(`schedule/${y}-${String(m).padStart(2, '0')}`);
        (d && d.games || []).forEach(g => {
            g.team1 = g.awayTeam || g.team1; g.team2 = g.homeTeam || g.team2; g.time = g.gameTime || g.time;
            const e = scheduleData.find(x => x.id === g.id);
            if (e) Object.assign(e, g); else scheduleData.push(g);
        });
    } catch (e) {}
}
async function pollLive() {
    try {
        const d = await fsDoc('live/today');
        (d && d.games || []).forEach(g => {
            g.team1 = g.awayTeam || g.team1; g.team2 = g.homeTeam || g.team2; g.time = g.gameTime || g.time;
            liveStore[g.id] = g;
            const e = scheduleData.find(x => x.id === g.id);
            if (e) Object.assign(e, g); else scheduleData.push(g);
        });
        if (tabIndex === 0) renderHomeLineup();
        else if (tabIndex === 1) renderBrowse();
        if (d && d.allDone === true && pollTimer) clearInterval(pollTimer);
    } catch (e) {}
}
async function syncLineup() {
    const b = baseDate();
    await Promise.all([loadMonth(b.getFullYear(), b.getMonth() + 1), pollLive()]);
    renderTab();
    pollTimer = setInterval(pollLive, 60000);
}

/* ── 시작 ──────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
    readStore();
    buildIndex();
    initAudio();

    document.body.dataset.theme = team;
    $('chip-team').textContent = team === 'all' ? '전체' : team;
    $('fp-shuffle').classList.toggle('on', shuffleOn);
    $('fp-repeat').classList.toggle('on', repeatMode !== 'off');
    if (localStorage.getItem('cheer_notice_seen')) $('notice-dot').style.display = 'none';

    const q = $('q');
    q.addEventListener('input', e => runSearch(e.target.value));
    q.addEventListener('change', e => saveQuery(e.target.value.trim()));
    q.addEventListener('keydown', e => { if (e.key === 'Enter') { saveQuery(q.value.trim()); q.blur(); } });
    $('q-clear').addEventListener('click', () => { q.value = ''; runSearch(''); q.focus(); });

    renderHome();
    paintPlay();
    setTimeout(() => $('loader').classList.add('off'), 260);

    syncLineup();
});
</script>
